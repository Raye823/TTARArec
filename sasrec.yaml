# NewModel (SASRec) Configuration for ML-100K
# model config
hidden_size: 64              # (int) The number of features in the hidden state
n_heads: 2                   # (int) The number of attention heads
n_layers: 2                  # (int) The number of transformer blocks
hidden_dropout_prob: 0.5     # (float) The dropout rate
norm_first: True             # (bool) Whether to apply layer norm before attention
hidden_act: gelu             # (str) Activation name for compatibility
initializer_range: 0.02      # (float) Init std for embeddings/linear weights

# dataset config
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
NEG_PREFIX: neg_
LABEL_FIELD: label
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id

# data loading
load_col:
    inter: [user_id, item_id, rating, timestamp]

# training settings
epochs: 300
train_batch_size: 256
learner: adam
learning_rate: 0.001
train_neg_sample_args: None  # Use CE loss, no negative sampling needed
training_neg_sample_num: 0
eval_step: 1
stopping_step: 10

# evaluation settings
eval_args:
    split: {'LS': 'valid_and_test'}
    order: TO
    group_by: user
    mode: full
repeatable: True
metrics: ['Recall','NDCG','MRR',]
topk: [5,10,20]
valid_metric: MRR@10
valid_metric_bigger: True
eval_batch_size: 256
metric_decimal_place: 4

#max_user_inter_num: 100
min_user_inter_num: 5
#max_item_inter_num: 100
min_item_inter_num: 5

# environment settings
gpu_id: '0'
use_gpu: True
seed: 220
state: INFO
reproducibility: True
data_path: './recbole/dataset/'
checkpoint_dir: 'saved'
show_progress: True
log_root: "./log/"

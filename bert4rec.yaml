# BERT4Rec Configuration
# Based on BERT for sequential recommendation

# model config
hidden_size: 64                 # BERT hidden units (bert_hidden_units)
n_heads: 4                       # Number of attention heads (bert_num_heads)
n_layers: 2                      # Number of transformer blocks (bert_num_blocks)
hidden_dropout_prob: 0.1        # Dropout rate (bert_dropout)
hidden_act: gelu                 # Activation function
initializer_range: 0.02         # Weight initialization range
mlm_probability: 0.15            # Mask probability (bert_mask_prob)

# dataset config
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
NEG_PREFIX: neg_
LABEL_FIELD: label
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50        # Maximum sequence length (bert_max_len)
POSITION_FIELD: position_id
training_neg_sample_num: 0
# data loading
load_col:
    inter: [user_id, item_id, rating, timestamp]

# data filtering
min_user_inter_num: 5            # Minimum user interactions (min_uc)
min_item_inter_num: 5            # Minimum item interactions (min_sc)
# lowest_val:
#     rating: 4                  # Minimum rating (min_rating), uncomment for ml-20m

# training settings
epochs: 100                      # Training epochs (num_epochs, 100 for ml-1m, 200 for ml-20m)
train_batch_size: 128           # Training batch size
learner: adam                   # Optimizer (Adam)
learning_rate: 0.001            # Learning rate (lr)
train_neg_sample_args: None     # No negative sampling for MLM training
eval_step: 1
stopping_step: 10

# evaluation settings
eval_args:
    split: {'LS': 'valid_and_test'}  # Leave one out split
    order: TO                        # Time order
    group_by: user
    mode: full                       # Full ranking evaluation
repeatable: True
metrics: ['Recall', 'NDCG', 'MRR']  # Evaluation metrics
topk: [ 5, 10, 20]      # Metric@K values (metric_ks)
valid_metric: NDCG@10               # Best metric for early stopping
valid_metric_bigger: True
eval_batch_size: 128                # Evaluation batch size
metric_decimal_place: 4

# environment settings
gpu_id: '0'                     # Device index (device_idx)
use_gpu: True                   # Use CUDA (device)
seed: 10                         # Model initialization seed (model_init_seed)
state: INFO
reproducibility: True
data_path: './recbole/dataset/'
checkpoint_dir: 'saved'
show_progress: True
log_root: "./log/"

# BERT4Rec specific notes:
# - train_negative_sample_size: 0 (handled by MLM, no explicit negative sampling)
# - test_negative_sample_size: 100 (handled by full ranking evaluation)
# - lr_schedule: Can be enabled via learning rate schedulers in trainer
# - decay_step: 25, gamma: 1.0 (can be added as scheduler config if needed)

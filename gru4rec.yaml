# GRU4Rec Configuration
# Based on "Improved Recurrent Neural Networks for Session-based Recommendations"
# RecBole implementation with parameters matching original paper

# model config - 核心GRU参数
embedding_size: 64         # 物品嵌入维度
hidden_size: 64           # GRU隐藏状态维度 (对应原始layers[0])
num_layers: 1             # GRU层数 (len(layers)=1)
dropout_prob: 0.4         # GRU dropout概率 (dropout_p_hidden)
loss_type: CE             # 损失函数类型: CE或BPR

# dataset config
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
NEG_PREFIX: neg_
LABEL_FIELD: label
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50   # 最大序列长度
POSITION_FIELD: position_id

# data loading
load_col:
    inter: [user_id, item_id, rating, timestamp]

# data filtering - 对应原始实现的数据过滤
min_user_inter_num: 5      # 最小用户交互数
min_item_inter_num: 5      # 最小物品交互数

# training settings - 匹配原始GRU4Rec参数
epochs: 10                 # 训练轮数 (n_epochs)
train_batch_size: 32       # 批次大小
learner: sgd               # 优化器 (使用SGD匹配momentum配置)
learning_rate: 0.2         # 学习率
momentum: 0.2              # SGD动量参数
weight_decay: 0.0          # 权重衰减 (对应bpreg=0.0)
train_neg_sample_args: null # CE损失不需要负采样
training_neg_sample_num : 0
eval_step: 1               # 每轮评估
stopping_step: 10          # 早停步数

# evaluation settings
eval_args:
    split: {'LS': 'valid_and_test'}  # 留一出验证和测试
    order: TO                        # 时间顺序
    group_by: user                   # 按用户分组
    mode: full                       # 全排序评估
repeatable: True
metrics: ['Recall', 'NDCG', 'MRR']  # 评估指标
topk: [5, 10, 20]                   # Top-K值
valid_metric: MRR@10                # 验证指标
valid_metric_bigger: True           # 指标越大越好
eval_batch_size: 256                # 评估批次大小
metric_decimal_place: 4             # 指标小数位数

# environment settings
gpu_id: '0'                # GPU设备ID
use_gpu: True              # 使用GPU
seed: 2020                 # 随机种子
state: INFO                # 日志级别
reproducibility: True      # 可重现性
data_path: './recbole/dataset/'  # 数据路径
checkpoint_dir: 'saved'    # 模型保存路径
show_progress: True        # 显示进度条
log_root: "./log/"         # 日志根目录

# GRU4Rec specific notes:
# 1. embedding层使用padding_idx=0实现constrained_embedding
# 2. embedding_size和hidden_size可以不同，实现灵活的架构
# 3. 使用dense层将hidden_size映射回embedding_size
# 4. dropout_prob应用于embedding层，对应dropout_p_embed
# 5. CE损失直接计算，BPR损失使用RecBole的BPRLoss实现
# 6. 原始论文的negative sampling在RecBole中通过损失函数类型控制
